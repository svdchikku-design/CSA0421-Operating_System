# B4: second service - sends result e-mails/SMS; has its own, smaller limits than the web portal
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-notifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result-notifier
  template:
    metadata:
      labels:
        app: result-notifier
    spec:
      containers:
        - name: notifier
          image: result-notifier:1.0
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "250m", memory: "256Mi"}
